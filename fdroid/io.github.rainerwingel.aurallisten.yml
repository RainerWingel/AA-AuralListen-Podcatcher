AntiFeatures:
  NonFreeNet:
    en-US: The podcast search uses the Apple iTunes Search API (besides fyyd.de).
      Subscribing by RSS address and OPML import work without it.
Categories:
  - Podcast
License: GPL-3.0-only
AuthorName: Artem A.
SourceCode: https://github.com/RainerWingel/AA-AuralListen-Podcatcher
IssueTracker: https://github.com/RainerWingel/AA-AuralListen-Podcatcher/issues
Changelog: https://github.com/RainerWingel/AA-AuralListen-Podcatcher/releases
Donate: https://paypal.me/Yama83

AutoName: AA-AuralListen Podcatcher

RepoType: git
Repo: https://github.com/RainerWingel/AA-AuralListen-Podcatcher.git

Builds:
  - versionName: 1.3.2
    versionCode: 5001
    commit: 05f780f6d6d52982d402a35a08c75d536afe18b1
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

